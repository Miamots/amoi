<!DOCTYPE html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>À moi!</title>
<meta name="description" content="Le tour de rôle en images, avec sablier et Time Timer.">
<meta name="theme-color" content="#fffaf2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="À moi!">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="img/icon-192.png">
<link rel="apple-touch-icon" href="img/icon-180.png">
<style>
@font-face{font-family:Barlow;font-weight:400;font-display:swap;src:url(fonts/barlow-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:Barlow;font-weight:500;font-display:swap;src:url(fonts/barlow-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:Barlow;font-weight:600;font-display:swap;src:url(fonts/barlow-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:Barlow;font-weight:700;font-display:swap;src:url(fonts/barlow-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:Barlow;font-weight:800;font-display:swap;src:url(fonts/barlow-latin-800-normal.woff2) format("woff2")}
:root{
  --ink:#4a3426;--muted:#8c7564;--cream:#fffaf2;--card:#ffffff;--line:#efe3d3;
  --green:#8db255;--green-d:#6c9240;--yellow:#f3bd45;--yellow-d:#d99d1f;--blue:#6db4c8;--blue-d:#4a97ad;
  --orange:#e88a3c;--pink:#e9a0a8;--red:#d9302c;
  --r:22px;--shadow:0 6px 18px rgba(120,80,40,.10),0 1px 3px rgba(120,80,40,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
html{background:var(--cream)}
body{
  font-family:Barlow,system-ui,sans-serif;color:var(--ink);font-size:17px;line-height:1.35;
  background:
    radial-gradient(circle at 8% 6%,rgba(141,178,85,.20),transparent 34%),
    radial-gradient(circle at 94% 16%,rgba(109,180,200,.20),transparent 34%),
    radial-gradient(circle at 88% 94%,rgba(243,189,69,.22),transparent 38%),
    radial-gradient(circle at 4% 88%,rgba(233,160,168,.18),transparent 34%),
    var(--cream);
  background-attachment:fixed;
  -webkit-user-select:none;user-select:none;
}
input{font-family:inherit;-webkit-user-select:text;user-select:text}
button{font-family:inherit;color:inherit;cursor:pointer}
#app{max-width:600px;margin:0 auto;min-height:100%;padding:calc(env(safe-area-inset-top) + 8px) 16px calc(env(safe-area-inset-bottom) + 110px);}
#app.fill{padding-bottom:calc(env(safe-area-inset-bottom) + 8px);display:flex;flex-direction:column;height:100%;min-height:0}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:.2px}
h2{font-size:22px;margin:22px 4px 10px}
h3{font-size:18px;margin:22px 4px 8px;display:flex;align-items:center;gap:8px}
h3 .num{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--green);color:#fff;font-size:15px}
.hint{color:var(--muted);font-size:15px;margin:-4px 4px 10px;font-weight:500}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* barre du haut */
.top{display:flex;align-items:center;gap:8px;min-height:52px}
.top h1{font-size:22px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibtn{width:46px;height:46px;border-radius:50%;border:0;background:#fff;box-shadow:var(--shadow);display:grid;place-items:center;flex:none}
.ibtn.on{background:var(--yellow);color:#fff}
.ibtn.off{color:#b9a796}

/* accueil */
.hero{text-align:center;padding:8px 0 4px}
.hero img{width:min(56vw,230px);height:auto;display:block;margin:0 auto}
.hero h1{font-size:44px;line-height:1;margin-top:4px;color:var(--ink)}
.hero p{margin:4px 0 0;color:var(--muted);font-weight:600}
.groups{display:grid;gap:12px}
.gcard{display:flex;align-items:center;gap:14px;background:#fff;border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow);border:0;text-align:left;width:100%;border-left:8px solid var(--c,var(--green))}
.gcard .gname{font-size:21px;font-weight:800}
.gcard .gsub{color:var(--muted);font-size:15px;font-weight:600}
.gcard .gtxt{flex:1;min-width:0}
.stack{display:flex}
.stack img{width:38px;height:38px;border-radius:50%;object-fit:cover;border:3px solid #fff;margin-left:-12px;background:#f6efe6}
.stack img:first-child{margin-left:0}
.empty{background:rgba(255,255,255,.7);border:2px dashed var(--line);border-radius:var(--r);padding:20px;text-align:center;color:var(--muted);font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.tile{background:#fff;border:0;border-radius:var(--r);box-shadow:var(--shadow);padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:700;font-size:15px}
.tile svg.i{width:30px;height:30px}
.tile:nth-child(1){color:var(--orange)}.tile:nth-child(2){color:var(--blue-d)}.tile:nth-child(3){color:var(--green-d)}
.tile span{color:var(--ink)}

/* boutons */
.btn{border:0;border-radius:999px;padding:14px 22px;font-size:18px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:#fff;box-shadow:var(--shadow)}
.btn.block{width:100%}
.btn.green{background:var(--green);color:#fff}
.btn.yellow{background:var(--yellow);color:#fff}
.btn.blue{background:var(--blue);color:#fff}
.btn.soft{background:#fff;color:var(--ink)}
.btn.small{padding:9px 14px;font-size:15px;font-weight:700}
.btn:disabled{opacity:.45}
.btn:active,.ibtn:active,.tile:active,.gcard:active,.kid:active,.chip:active{transform:scale(.97)}
.link{background:none;border:0;color:var(--muted);font-weight:700;font-size:15px;padding:12px;text-decoration:underline}
.link.danger{color:#c0463c}
.foot{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(env(safe-area-inset-bottom) + 12px);background:linear-gradient(to top,var(--cream) 70%,rgba(255,250,242,0));z-index:5}
.foot>div{max-width:600px;margin:0 auto;display:flex;gap:10px}
.foot .btn{flex:1;font-size:20px;padding:16px}
.row{display:flex;gap:8px;flex-wrap:wrap}

/* enfants */
.kids{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:12px}
.kid{position:relative;background:#fff;border:0;border-radius:var(--r);box-shadow:var(--shadow);padding:10px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:6px}
.kid img{width:92px;height:92px;border-radius:50%;object-fit:cover;background:#f6efe6}
.kid b{font-size:16px;font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kid.add{background:rgba(255,255,255,.6);border:2px dashed #e2d3bf;box-shadow:none;color:var(--muted);justify-content:center;min-height:130px}
.kid.add svg.i{width:34px;height:34px}
.kid.txt{justify-content:center;min-height:118px}.kid.txt b{font-size:18px;white-space:normal;text-align:center}
.kid.sel{outline:4px solid var(--green);background:#f4f9ec}
.kid.dim img{opacity:.55}
.badge{position:absolute;top:6px;right:8px;min-width:28px;height:28px;border-radius:14px;background:var(--green);color:#fff;font-weight:800;display:grid;place-items:center;font-size:16px;padding:0 6px;box-shadow:0 2px 4px rgba(0,0,0,.15)}

/* choix */
.seg{display:flex;background:#fff;border-radius:999px;padding:5px;box-shadow:var(--shadow);gap:4px}
.seg button{flex:1;border:0;background:none;border-radius:999px;padding:11px 6px;font-size:16px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--blue);color:#fff}
.chips{display:flex;gap:10px;overflow-x:auto;padding:4px 4px 10px;margin:0 -4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:#fff;border-radius:18px;box-shadow:var(--shadow);padding:8px 14px;font-weight:700;font-size:16px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:64px}
.chip img{width:64px;height:64px;border-radius:14px;object-fit:cover}
.chip.on{background:var(--yellow);color:#fff}
.chip.on.blank{background:var(--yellow)}
.preview{background:rgba(255,255,255,.75);border-radius:16px;padding:10px 14px;font-weight:600;color:var(--muted);font-size:15px;margin-top:10px}
.preview b{color:var(--ink)}

/* minuteurs */
.tarea{display:flex;align-items:center;justify-content:center;gap:14px}
.tcol{display:flex;flex-direction:column;align-items:center;gap:6px}
.hg{position:relative;aspect-ratio:560/777;height:var(--th,220px)}
.hg canvas,.hg img{position:absolute;inset:0;width:100%;height:100%}
.tt{width:var(--th,220px);height:var(--th,220px)}
.tt svg{width:100%;height:100%;display:block;filter:drop-shadow(0 4px 10px rgba(80,50,20,.15))}
.tt text{font-family:Barlow,sans-serif;font-weight:700;font-size:12px;fill:#2b2b2b;text-anchor:middle}
.tctrl{display:flex;align-items:center;gap:8px}
.tleft{font-weight:800;font-size:20px;min-width:52px;text-align:center;font-variant-numeric:tabular-nums}
.tctrl .ibtn{width:42px;height:42px}
.actimg{width:var(--ah,120px);height:var(--ah,120px);border-radius:22px;object-fit:cover;box-shadow:var(--shadow);background:#fff}
.actname{font-weight:800;font-size:17px;text-align:center}
.actname.big{font-size:24px;background:#fff;border-radius:18px;padding:10px 18px;box-shadow:var(--shadow);max-width:40vw}
.noimg{width:150px;height:150px;border-radius:26px;border:3px dashed #e2d3bf;display:grid;place-items:center;color:var(--muted);font-weight:700;background:rgba(255,255,255,.6);text-align:center;padding:8px}
.noimg.sm{width:76px;height:76px;border-radius:18px;font-size:13px;overflow:hidden;border-width:2px}
.stepper{display:flex;align-items:center;gap:14px;background:#fff;border-radius:999px;padding:6px;box-shadow:var(--shadow);width:max-content}
.stepper .ibtn{width:48px;height:48px;background:var(--blue);color:#fff;box-shadow:none}
.stepper .ibtn:disabled{opacity:.3}
.stepper span{min-width:110px;text-align:center;font-weight:800;font-size:19px}
.turn.now.many img{width:clamp(60px,17vw,78px);height:clamp(60px,17vw,78px)}
.turn.now.many b{font-size:19px}
.turn.now.many .ppl{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:8px}
.turn.now.lots img{width:clamp(50px,14vw,62px);height:clamp(50px,14vw,62px);border-width:3px}
.turn.now.lots b{font-size:16px}
.turn.now.lots .ppl{grid-template-columns:repeat(4,1fr)}
.turn .ppl{row-gap:8px}

/* séquence */
.run-top{flex:none;padding:4px 0 8px}
.seq{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:4px 2px 10px}
.turn{display:flex;align-items:center;gap:12px;background:#fff;border-radius:var(--r);padding:10px 12px;box-shadow:var(--shadow);opacity:.8}
.turn .wrap{flex:1;min-width:0}
.turn .ppl{display:flex;gap:10px;flex-wrap:wrap;min-width:0}
.turn .p{display:flex;align-items:center;gap:12px;min-width:0}
.turn img{width:74px;height:74px;border-radius:50%;object-fit:cover;background:#f6efe6;flex:none}
.turn.many img,.turn.lots img,.turn.two img{width:58px;height:58px}
.turn.many .p,.turn.lots .p,.turn.two .p{flex-direction:column;gap:2px}
.turn b{font-size:20px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.turn.two b,.turn.many b,.turn.lots b{font-size:15px}
.turn .n{color:#c2ae9b;font-weight:800;font-size:15px;width:20px;text-align:center;flex:none}
.turn.now{opacity:1;padding:14px 10px;border:4px solid var(--green);background:#f7fbf0}
.turn.now .ppl{justify-content:space-around}
.turn.now .p{flex-direction:column;gap:4px}
.turn.now img{border:4px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.12)}
.turn.now.one img{width:clamp(140px,44vw,220px);height:clamp(140px,44vw,220px)}
.turn.now.two img{width:clamp(110px,34vw,170px);height:clamp(110px,34vw,170px)}
.turn.now.many img{width:clamp(86px,25vw,120px);height:clamp(86px,25vw,120px)}
.turn.now.lots img{width:clamp(66px,19vw,92px);height:clamp(66px,19vw,92px);border-width:3px}
.turn.now.lots .ppl{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.turn.now b{font-size:26px;font-weight:800}
.turn.now.two b{font-size:22px}.turn.now.many b,.turn.now.lots b{font-size:17px}
.nowlbl{display:block;text-align:center;font-weight:800;color:var(--green-d);font-size:15px;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.run-top .hg,.run-top .tt{transition:height .25s,width .25s}
.run-top .actimg{transition:width .25s,height .25s}
.run-top.compact .hg,.run-top.compact .tt{--th:84px!important}
.run-top.compact .actimg{--ah:64px!important}
.run-top.compact .actname.big{font-size:18px;padding:6px 12px}
.run-top.compact .tctrl .x{display:none}
.tctrl .add1{width:auto;padding:0 12px;border-radius:21px;font-weight:800;font-size:15px;color:var(--green-d)}
.tt svg{touch-action:none;cursor:grab}
.durs{display:flex;flex-wrap:wrap;gap:8px}
.durs button{border:0;background:#fff;border-radius:999px;padding:11px 16px;font-size:16px;font-weight:700;color:var(--muted);box-shadow:var(--shadow)}
.durs button.on{background:var(--blue);color:#fff}
.dpick{display:flex;flex-direction:column;gap:12px;align-items:center;margin-bottom:16px}
.dpick>div{display:flex;align-items:center;gap:14px}
.dpick span{min-width:90px;text-align:center}
.dpick b{font-size:40px;font-weight:800;font-variant-numeric:tabular-nums}
.dpick small{font-size:17px;font-weight:700;color:var(--muted);margin-left:4px}
.dpick .ibtn{background:var(--blue);color:#fff}
.preview{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.preview .pt{display:inline-flex}
.preview .pt img{width:30px;height:30px;border-radius:50%;object-fit:cover;border:2px solid #fff;margin-left:-8px;background:#f6efe6}
.preview .pt img:first-child{margin-left:0}
.preview i{font-style:normal;color:var(--muted)}
.next-kids.sm img{width:80px;height:80px}
.run-foot{flex:none;display:flex;gap:10px;padding-top:8px}
.run-foot .btn.next{flex:1;font-size:22px;padding:18px}
.run-foot .ibtn{width:62px;height:62px}

/* réglages */
.card{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.card p{margin:0 0 10px;color:var(--muted);font-weight:500}
.opt{display:flex;align-items:center;gap:14px;border:3px solid transparent;border-radius:18px;padding:10px;background:#fbf7f1;width:100%;text-align:left;margin-bottom:10px}
.opt.on{border-color:var(--blue);background:#eef7fa}
.opt .mini{width:78px;height:78px;flex:none}
.opt b{display:block;font-size:17px}
.opt small{color:var(--muted);font-size:14px;font-weight:600}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:700}
.tog{width:58px;height:34px;border-radius:17px;border:0;background:#ddd2c4;position:relative;flex:none;transition:.2s}
.tog::after{content:"";position:absolute;top:4px;left:4px;width:26px;height:26px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.tog.on{background:var(--green)}.tog.on::after{left:28px}

/* fenêtres */
#modal{position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;justify-content:center;background:rgba(74,52,38,.35);padding:16px}
#modal.show{display:flex}
@media (min-height:600px){#modal{align-items:center}}
.mbox{background:var(--cream);border-radius:28px;width:100%;max-width:440px;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.25);max-height:92vh;overflow:auto;animation:pop .22s ease-out}
@keyframes pop{from{transform:translateY(20px) scale(.97);opacity:0}}
.mbox h2{margin:0 0 14px;text-align:center}
.mbox p{text-align:center;color:var(--muted);font-weight:600;margin:0 0 14px}
.mphoto{display:flex;justify-content:center;margin-bottom:12px}
.mphoto img{width:150px;height:150px;border-radius:50%;object-fit:cover;background:#f6efe6;box-shadow:var(--shadow);border:5px solid #fff}
.mphoto.sq img{border-radius:26px}
.field{width:100%;font-size:20px;font-weight:700;padding:14px 16px;border-radius:16px;border:2px solid var(--line);background:#fff;color:var(--ink);margin:12px 0;outline:none;text-align:center}
.field:focus{border-color:var(--blue)}
.mact{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.photo-row{display:flex;gap:10px;justify-content:center}
.done-img{width:100%;max-width:330px;display:block;margin:0 auto 6px}
.next-kids{display:flex;justify-content:center;gap:14px;margin:6px 0 16px;flex-wrap:wrap}
.next-kids div{display:flex;flex-direction:column;align-items:center;font-weight:800;font-size:20px}
.next-kids img{width:130px;height:130px;border-radius:50%;object-fit:cover;border:4px solid var(--green);background:#f6efe6}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 100px);transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-weight:700;z-index:60;box-shadow:var(--shadow);max-width:90vw;text-align:center;animation:pop .2s}
.solo-timer{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;min-height:0}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"><div class="mbox" id="mbox"></div></div>
<script>
"use strict";
/* ---------- Icônes ---------- */
const IC={
  back:'<path d="M15 5l-7 7 7 7"/>',
  minus:'<path d="M5 12h14"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  hourglass:'<path d="M6 3h12M6 21h12M7 3c0 5 10 6 10 9s-10 4-10 9M17 3c0 5-10 6-10 9s10 4 10 9"/>',
  play:'<path d="M8 5l11 7-11 7z" fill="currentColor"/>',
  pause:'<path d="M8 5v14M16 5v14"/>',
  restart:'<path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v5h5"/>',
  next:'<path d="M5 12h14M13 6l6 6-6 6"/>',
  prev:'<path d="M19 12H5M11 6l-6 6 6 6"/>',
  sliders:'<path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/>',
  bell:'<path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21h4"/>',
  belloff:'<path d="M6 16V11a6 6 0 0 1 9-5.2M18 11v5l2 2H8"/><path d="M10 21h4M3 3l18 18"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>',
  slide:'<path d="M4 20V8l6-4v16M10 9h4l6 11"/><path d="M4 12h6"/>',
  shuffle:'<path d="M3 7h4l10 10h4M3 17h4l3-3M14 10l3-3h4M18 4l3 3-3 3M18 14l3 3-3 3"/>',
  edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',
  camera:'<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',
  trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',
  down:'<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>',
  up:'<path d="M12 16V5M7 10l5-5 5 5M5 20h14"/>',
  check:'<path d="M5 12l5 5 9-10"/>',
  users:'<circle cx="9" cy="8" r="3.5"/><path d="M3 20c0-3.5 2.7-6 6-6s6 2.5 6 6"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14c3 0 5 2 5 5"/>'
};
const ic=(n,c='')=>`<svg class="i ${c}" viewBox="0 0 24 24">${IC[n]}</svg>`;

/* ---------- Utilitaires ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const AVATAR='img/avatar.webp';

/* ---------- Photos : recadrage carré, réduit ---------- */
function readPhoto(file,size=400){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file);const img=new Image();
    img.onload=()=>{const s=Math.min(img.naturalWidth,img.naturalHeight);const c=document.createElement('canvas');c.width=c.height=size;
      c.getContext('2d').drawImage(img,(img.naturalWidth-s)/2,(img.naturalHeight-s)/2,s,s,0,0,size,size);
      URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',0.85))};
    img.onerror=()=>{URL.revokeObjectURL(url);rej()};img.src=url;
  });
}

let AC=null;
function audio(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
document.addEventListener('pointerdown',audio,{passive:true});
function beep(){
  const ac=audio();if(navigator.vibrate)try{navigator.vibrate([200,120,200,120,200])}catch(e){}
  if(!ac)return;const t0=ac.currentTime+0.05;
  for(let r=0;r<2;r++)for(let i=0;i<3;i++){const t=t0+r*1.25+i*0.3;const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=1046;
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.6,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+0.2);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+0.22)}
}

/* ---------- Écran allumé pendant le minuteur ---------- */
let wakeLock=null;
async function wake(on){try{if(on&&!wakeLock&&navigator.wakeLock){wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>wakeLock=null)}else if(!on&&wakeLock){await wakeLock.release();wakeLock=null}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&T.running)wake(true)});

/* ---------- Moteur du minuteur ---------- */
const T={dur:120,acc:0,t0:0,running:false,done:false,onDone:null,
  elapsed(){return this.acc+(this.running?(performance.now()-this.t0)/1000:0)},
  rem(){return Math.max(0,this.dur-this.elapsed())},
  play(){if(this.running)return;if(this.rem()<=0)this.reset();this.t0=performance.now();this.running=true;this.done=false;wake(true);syncCtrl()},
  pause(){if(!this.running)return;this.acc+=(performance.now()-this.t0)/1000;this.running=false;wake(false);syncCtrl()},
  reset(d){if(d)this.dur=d;this.acc=0;this.running=false;this.done=false;wake(false);syncCtrl()},
  restart(){this.reset();this.play()},
  addTime(sec){if(this.done){this.acc=this.dur}this.dur+=sec;this.done=false;syncCtrl()},
  setRem(rem,newDur){if(newDur!=null)this.dur=newDur;this.acc=Math.max(0,this.dur-rem);this.done=false;if(this.running)this.t0=performance.now()},
  check(){if(this.running&&this.rem()<=0){this.acc=this.dur;this.running=false;this.done=true;wake(false);syncCtrl();if(S.settings.sound)beep();if(this.onDone)this.onDone()}}
};
setInterval(()=>T.check(),200);
function syncCtrl(){const b=$('#tplay');if(b)b.innerHTML=ic(T.running?'pause':'play')}

  [[0.315,0.41,'l',0.075],[0.33,0.40,'r',0.085],[0.60,0.73,'l',0.075],[0.63,0.75,'r',0.085]].forEach(([y0,y1,sd,off])=>{
    ctx.beginPath();let first=true;
    R.forEach(r=>{if(r[0]<y0||r[0]>y1)return;const x=(sd==='l'?r[1]+off:r[2]-off)*W;first?ctx.moveTo(x,r[0]*H):ctx.lineTo(x,r[0]*H);first=false});ctx.stroke()});
  ctx.restore();
}

/* ---------- Time Timer (même sens qu'une horloge) ---------- */
function ttSVG(mode,dur,mini){
  const c=100;const pt=(deg,r)=>{const a=deg*Math.PI/180;return[(c+r*Math.sin(a)).toFixed(2),(c-r*Math.cos(a)).toFixed(2)]};
  let units,minor,major,lab;
  if(mode==='classique'){units=60;minor=1;major=5;lab=u=>u}
  else if(dur<=60){units=Math.max(5,dur);minor=5;major=15;lab=u=>u}
  else{units=dur;if(dur<=600){minor=dur<=300?15:30;major=60}else{minor=60;major=300}lab=u=>u/60}
  let tk='',lb='';
  for(let u=0;u<units;u+=minor){const M=u%major===0;const d=u/units*360;const[a,b]=pt(d,M?64:66.5),[x,y]=pt(d,M?73:71);
    tk+=`<line x1="${a}" y1="${b}" x2="${x}" y2="${y}" stroke="#2b2b2b" stroke-width="${M?2.2:1.1}" stroke-linecap="round"/>`;
    if(M&&!mini){const[lx,ly]=pt(d,81.5);lb+=`<text x="${lx}" y="${ly}" dy="0.36em">${lab(u)}</text>`}}
  return `<svg viewBox="0 0 200 200"><rect x="4" y="4" width="192" height="192" rx="32" fill="#f7f4ef" stroke="#e6ddd0" stroke-width="2"/><circle cx="100" cy="100" r="89" fill="#fff" stroke="#e8e1d7" stroke-width="1.5"/><path class="ttsec" fill="#d9302c" d="${mini?secPath(mode==='classique'?0.25:0.75):''}"/>${tk}${lb}<circle cx="100" cy="100" r="10" fill="#2f2f2f"/><circle cx="100" cy="100" r="4" fill="#666"/></svg>`;
}
function secPath(fr){const c=100,r=62;if(fr<=0.0005)return'';if(fr>=0.9995)return`M100 ${c-r}A${r} ${r} 0 1 1 100 ${c+r}A${r} ${r} 0 1 1 100 ${c-r}Z`;
  const a=fr*2*Math.PI;const x=c+r*Math.sin(a),y=c-r*Math.cos(a);return`M100 100L100 ${c-r}A${r} ${r} 0 ${fr>0.5?1:0} 1 ${x.toFixed(2)} ${y.toFixed(2)}Z`}
function ttFrac(){const r=T.rem();return S.settings.ttFace==='classique'?Math.min(1,r/3600):(T.dur?r/T.dur:0)}

/* ---------- Bloc minuteur (affichage) ---------- */
function timerBlock(type,h){
  const vis=type==='sablier'?`<div class="hg" style="--th:${h}"><img src="img/sablier.webp" alt="Sablier"><canvas></canvas></div>`
    :`<div class="tt" style="--th:${h}">${ttSVG(S.settings.ttFace,T.dur)}</div>`;
  return `<div class="tcol" id="tbox" data-type="${type}">${vis}<div class="tctrl"><button class="ibtn" id="tplay" data-a="tPlay" aria-label="Démarrer ou pause">${ic(T.running?'pause':'play')}</button><span class="tleft" id="tleft">${fmt(T.rem())}</span><button class="ibtn x" data-a="tRestart" aria-label="Recommencer">${ic('restart')}</button><button class="ibtn x add1" data-a="tAdd" aria-label="Ajouter une minute">+1 min</button></div></div>`;
}
function refreshTT(){const tt=$('#tbox .tt');if(tt)tt.innerHTML=ttSVG(S.settings.ttFace,T.dur)}
function frame(){
  const box=$('#tbox');
  if(box){const l=$('#tleft');if(l)l.textContent=fmt(T.rem());
    if(box.dataset.type==='sablier'){const cv=box.querySelector('canvas');if(cv)drawHG(cv)}
    else{const p=box.querySelector('.ttsec');if(p)p.setAttribute('d',secPath(ttFrac()))}}
  requestAnimationFrame(frame);
}
/* Régler le temps en glissant le doigt sur le Time Timer */
let drag=null;
function dragTo(e){
  const r=drag.sv.getBoundingClientRect();const dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);
  if(Math.hypot(dx,dy)<r.width*0.08)return;let ang=Math.atan2(dx,-dy)*180/Math.PI;if(ang<0)ang+=360;
  if(S.settings.ttFace==='classique'){const m=Math.round(ang/6);T.setRem(m*60,m*60)}
  else{const rem=Math.min(T.dur,Math.round(ang/360*T.dur/5)*5);T.setRem(rem)}
}
document.addEventListener('pointerdown',e=>{const sv=e.target.closest('#tbox .tt svg');if(!sv)return;e.preventDefault();audio();drag={sv,was:T.running};T.pause();try{sv.setPointerCapture(e.pointerId)}catch(_){}dragTo(e)});
document.addEventListener('pointermove',e=>{if(drag)dragTo(e)});
const endDrag=()=>{if(!drag)return;const w=drag.was;drag=null;if(w&&T.rem()>0)T.play()};
document.addEventListener('pointerup',endDrag);document.addEventListener('pointercancel',endDrag);

/* Choix de la durée */
function durPicker(cur,action){
  const custom=!DURS.includes(cur);
  return `<div class="durs">${DURS.map(d=>`<button class="${cur===d?'on':''}" data-a="${action}" data-v="${d}">${durLabel(d)}</button>`).join('')}<button class="${custom?'on':''}" data-a="${action}" data-v="custom">${custom?durLabel(cur):'Autre…'}</button></div>`;
}
function durModal(cur,cb){
  let m=Math.floor(cur/60),sec=cur%60;
  const draw=()=>{$('#dM').textContent=m;$('#dS').textContent=String(sec).padStart(2,'0')};
  openModal(`<h2>Durée personnalisée</h2>
    <div class="dpick"><div><button class="ibtn" data-a="dStep" data-k="m" data-v="-1">${ic('minus')}</button><span><b id="dM">${m}</b><small>min</small></span><button class="ibtn" data-a="dStep" data-k="m" data-v="1">${ic('plus')}</button></div>
    <div><button class="ibtn" data-a="dStep" data-k="s" data-v="-15">${ic('minus')}</button><span><b id="dS">${String(sec).padStart(2,'0')}</b><small>s</small></span><button class="ibtn" data-a="dStep" data-k="s" data-v="15">${ic('plus')}</button></div></div>
    <div class="mact"><button class="btn green" data-a="dOk">${ic('check')} Choisir</button><button class="btn soft" data-a="mClose">Annuler</button></div>`,
    {step:(k,v)=>{if(k==='m')m=Math.max(0,Math.min(60,m+v));else{sec+=v;if(sec<0){if(m>0){m--;sec=45}else sec=0}if(sec>=60){sec=0;m=Math.min(60,m+1)}}draw()},ok:()=>{const t=m*60+sec;if(t<5){toast('Choisis au moins quelques secondes.');return}closeModal();cb(t)}});
}

    openModal(`<img class="done-img" src="img/bravo.webp" alt=""><h2>Au tour de…</h2><div class="next-kids ${ks.length>2?'sm':''}">${ks.map(k=>`<div><img src="${k.photo||AVATAR}" alt="">${S.settings.showNames?esc(k.name):''}</div>`).join('')}</div>
      <div class="mact"><button class="btn green" data-a="doneNext">C'est parti! ${ic('next')}</button><button class="btn soft" data-a="mClose">Fermer</button></div>`);
  }else if(V.name==='solo'){
    openModal(`<img class="done-img" src="img/bravo.webp" alt=""><h2>Temps écoulé!</h2><div class="mact"><button class="btn green" data-a="doneRestart">${ic('restart')} Recommencer</button><button class="btn soft" data-a="mClose">Fermer</button></div>`);
  }
}
T.onDone=showDone;

/* ---------- Actions ---------- */
const A={
  go:el=>{if(el.dataset.to==='solo'){T.reset(S.settings.soloDur)}go(el.dataset.to)},
  back:()=>{if(V.name==='run'||V.name==='solo')T.reset();back()},
  newGroup:()=>promptName('Nouveau groupe','',name=>{const g={id:uid(),name,color:COLORS[S.groups.length%COLORS.length],kids:[],last:null};S.groups.push(g);save();go('group',{id:g.id})}),
  openGroup:el=>{const g=findGroup(el.dataset.id);if(!g.kids.length){go('group',{id:g.id});return}
    const run={order:g.kids.map(k=>k.id),per:1,act:'',timer:'sablier',dur:60,turn:0};T.reset(60);go('run',{id:g.id,run});T.play()},
  custom:()=>openModal(`<h2>Personnaliser</h2><div class="mact"><button class="btn green" data-a="goSetup">${ic('sliders')} Personnaliser le tour de rôle</button><button class="btn blue" data-a="goGroup">${ic('users')} Personnaliser le groupe</button><button class="btn soft" data-a="mClose">Fermer</button></div>`),
  goSetup:()=>{closeModal();const R=V.run;T.reset();go('setup',{id:V.id,st:{order:[...R.order],per:R.per,act:R.act,timer:R.timer,dur:R.dur}},true)},
  goGroup:()=>{closeModal();T.reset();go('group',{id:V.id},true)},
  names:()=>{S.settings.showNames=!S.settings.showNames;save();rerender()},
  tAdd:()=>{T.addTime(60);refreshTT();toast('+1 minute')},
  dStep:el=>MCTX.step(el.dataset.k,+el.dataset.v),
  dOk:()=>MCTX.ok(),
  renameGroup:()=>{const g=findGroup(V.id);promptName('Nom du groupe',g.name,name=>{g.name=name;save();render()})},
  delGroup:()=>{const g=findGroup(V.id);ask('Supprimer le groupe?',`« ${esc(g.name)} » et ses ${g.kids.length} enfant(s) seront retirés de cet appareil.`,'Supprimer',()=>{S.groups=S.groups.filter(x=>x!==g);save();back()},true)},
  editKid:el=>{const g=findGroup(V.id);photoEditor('kid',el.dataset.id?g.kids.find(k=>k.id===el.dataset.id):null)},
  editAct:el=>photoEditor('act',el.dataset.id?findAct(el.dataset.id):null),
  setup:()=>{const g=findGroup(V.id);const L=g.last||{};go('setup',{id:g.id,st:{order:(L.order||[]).filter(id=>g.kids.some(k=>k.id===id)),per:L.per||1,act:L.act&&findAct(L.act)?L.act:'',timer:L.timer||'sablier',dur:L.dur||120}})},
  pick:el=>{const o=V.st.order,id=el.dataset.id,i=o.indexOf(id);i>=0?o.splice(i,1):o.push(id);rerender()},
  pickAll:()=>{const g=findGroup(V.id);const o=V.st.order;g.kids.forEach(k=>{if(!o.includes(k.id))o.push(k.id)});rerender()},
  pickNone:()=>{V.st.order=[];rerender()},
  shuffle:()=>{const o=V.st.order;for(let i=o.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[o[i],o[j]]=[o[j],o[i]]}rerender()},
  per:el=>{V.st.per=Math.max(1,Math.min(8,V.st.per+(+el.dataset.v)));rerender()},
  act:el=>{V.st.act=el.dataset.id;rerender()},
  tType:el=>{V.st.timer=el.dataset.v;rerender()},
  dur:el=>{if(el.dataset.v==='custom'){durModal(V.st.dur,t=>{V.st.dur=t;rerender()});return}V.st.dur=+el.dataset.v;rerender()},
  startRun:()=>{const g=findGroup(V.id);const st=V.st;g.last={...st,order:[...st.order]};save();
    const run={order:[...st.order],per:st.per,act:st.act,timer:st.timer,dur:st.dur,turn:0};
    T.reset(st.dur);go('run',{id:g.id,run},true);if(run.timer!=='aucun')T.play()},
  nextTurn:()=>{V.run.turn++;history.replaceState(V,'');if(V.run.timer!=='aucun'){T.reset(V.run.dur)}render();if(V.run.timer!=='aucun')T.play()},
  prevTurn:()=>{if(!V.run.turn)return;V.run.turn--;history.replaceState(V,'');if(V.run.timer!=='aucun'){T.reset(V.run.dur)}render();if(V.run.timer!=='aucun')T.play()},
  doneNext:()=>{closeModal();A.nextTurn()},
  doneRestart:()=>{closeModal();T.restart()},
  tPlay:()=>{audio();T.running?T.pause():T.play()},
  tRestart:()=>{T.reset();if(V.name==='run')T.play()},
  sound:()=>{S.settings.sound=!S.settings.sound;save();render();toast(S.settings.sound?'Son activé':'Son désactivé')},
  soloType:el=>{S.settings.soloType=el.dataset.v;save();T.reset(S.settings.soloDur);render()},
  soloDur:el=>{const set=t=>{S.settings.soloDur=t;save();T.reset(t);render()};if(el.dataset.v==='custom'){durModal(S.settings.soloDur,set);return}set(+el.dataset.v)},
  face:el=>{S.settings.ttFace=el.dataset.v;save();render()},
  export:()=>doExport(),
  mClose:()=>closeModal(),
  mRmPhoto:el=>{MCTX.d.photo='';$('#mImg').outerHTML=`<div class="noimg" id="mImg">Pas d'image</div>`;el.remove()},
  mOk:()=>{const f=MCTX.onOk;closeModal();f&&f()},
  mOkName:()=>{const v=$('#mName').value.trim();if(!v){$('#mName').focus();return}const f=MCTX.onOk;closeModal();f(v)},
  mSavePhoto:()=>{const {kind,item,d}=MCTX;const name=$('#mName').value.trim();
    if(kind==='kid'){if(!name&&!d.photo){toast('Ajoute une photo ou un prénom.');return}const g=findGroup(V.id);
      if(item){item.name=name;item.photo=d.photo}else g.kids.push({id:uid(),name,photo:d.photo})}
    else{if(!name){$('#mName').focus();toast("Écris le nom de l'activité.");return}
      if(item){item.name=name;item.photo=d.photo}else{const a={id:uid(),name,photo:d.photo};S.activities.push(a);if(V.name==='setup')V.st.act=a.id}}
    save();closeModal();render()},
  mDelPhoto:()=>{const {kind,item}=MCTX;if(kind==='kid'){const g=findGroup(V.id);g.kids=g.kids.filter(k=>k!==item)}else S.activities=S.activities.filter(a=>a!==item);save();closeModal();render()},
  impAdd:()=>{const d=MCTX.data;const ids=new Set(S.groups.map(g=>g.id));d.groups.forEach(g=>{if(ids.has(g.id))g.id=uid();S.groups.push(g)});
    const aids=new Set(S.activities.map(a=>a.id));d.activities.forEach(a=>{if(aids.has(a.id))a.id=uid();S.activities.push(a)});save();closeModal();toast('Sauvegarde ajoutée!');go('home',{},true)},
  impReplace:()=>{const d=MCTX.data;S=d;save();closeModal();toast('Sauvegarde importée!');go('home',{},true)}
};
function rerender(){const y=window.scrollY;history.replaceState(V,'');render();window.scrollTo(0,y)}
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||el.disabled)return;const f=A[el.dataset.a];if(f){e.preventDefault();f(el,e)}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='mName'){const b=$('#mbox [data-a="mOkName"],#mbox [data-a="mSavePhoto"]');if(b)b.click()}});
document.addEventListener('change',async e=>{
  const c=e.target.dataset&&e.target.dataset.c;if(!c)return;const file=e.target.files&&e.target.files[0];e.target.value='';if(!file)return;
  if(c==='photo'){try{const url=await readPhoto(file);MCTX.d.photo=url;const m=$('#mImg');if(m.tagName==='IMG')m.src=url;else m.outerHTML=`<img id="mImg" src="${url}" alt="">`;
    if(MCTX.kind==='act'&&!$('[data-a=mRmPhoto]'))$('.photo-row').insertAdjacentHTML('beforeend','<button class="btn soft small" data-a="mRmPhoto">Retirer l\'image</button>')}catch(err){toast("Cette image n'a pas pu être lue.")}}
  if(c==='import')doImport(file);
});

/* ---------- Exporter / importer ---------- */
async function doExport(){
  const data=JSON.stringify({app:'a-moi',version:1,date:new Date().toISOString(),data:S});
  const name=`a-moi-sauvegarde-${new Date().toISOString().slice(0,10)}.json`;
  const blob=new Blob([data],{type:'application/json'});
  try{const file=new File([blob],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})&&/Android|iPhone|iPad|Mobile/i.test(navigator.userAgent)){await navigator.share({files:[file],title:'Sauvegarde À moi!'});return}}catch(e){if(e&&e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);toast('Sauvegarde exportée');
}
async function doImport(file){
  try{const j=JSON.parse(await file.text());if(!j||j.app!=='a-moi'||!j.data)throw 0;const d=normalize(j.data);
    const nk=d.groups.reduce((s,g)=>s+g.kids.length,0);
    openModal(`<h2>Importer la sauvegarde</h2><p>${d.groups.length} groupe(s), ${nk} enfant(s), ${d.activities.length} activité(s).</p>
      <div class="mact"><button class="btn green" data-a="impAdd">Ajouter à mes données</button><button class="btn yellow" data-a="impReplace">Remplacer toutes mes données</button><button class="btn soft" data-a="mClose">Annuler</button></div>`,{data:d});
  }catch(e){toast("Ce fichier n'est pas une sauvegarde À moi!")}
}

/* ---------- Démarrage ---------- */
(async function init(){
  try{await DB.open();S=normalize(await DB.get('state'));if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{})}
  catch(e){toast("Mode privé : les données ne seront pas gardées.")}
  history.replaceState(V,'');render();requestAnimationFrame(frame);
  if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){navigator.serviceWorker.register('sw.js').catch(()=>{})}
})();
</script>
